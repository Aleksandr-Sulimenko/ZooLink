# MVP CI gate. Per docs/specs/09-testing-strategy.md and security/security_specification.md.
# DB workflow is SQL-canonical + Prisma introspect (ADR-0007): the schema is applied from
# database_schema.sql and the typed client is generated from the committed schema.prisma —
# Prisma Migrate is intentionally NOT used, so there is no `prisma migrate deploy` step.
name: CI

on:
  pull_request:
  push:
    branches: [main, test, backend]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://zoolink:ci@localhost:5432/zoolink_test?schema=public
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zoolink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client (from committed schema.prisma)
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (coverage)
        run: npm test -- --coverage

      - name: Apply canonical schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database_schema.sql

      - name: Prisma schema drift check (schema.prisma must match the DB)
        run: |
          npm run db:pull
          git diff --exit-code prisma/schema.prisma \
            || (echo "::error::prisma/schema.prisma is out of sync — run 'npm run db:sync' and commit"; exit 1)

      - name: Seed runner (idempotent — run twice)
        run: |
          npm run seed
          npm run seed

      # Integration/e2e against the real PG + Redis services (outbox round-trip; auth/authz over
      # HTTP). The canonical schema was applied above, so the DB is at its final shape. App boot
      # requires the full env contract — provide test-only secrets here (NOT real values).
      - name: E2E / integration tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_access_secret_0000000000000000000000000000
          JWT_REFRESH_SECRET: ci_refresh_secret_000000000000000000000000000
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret
          S3_BUCKET: zoolink-media
        run: npm run test:e2e

  # Schema↔migrations convergence guard (ADR-0007: SQL-canonical + Prisma introspect, NO prisma migrate).
  # The two supported bootstrap paths must agree:
  #   (1) a fresh DB built from the canonical database_schema.sql, and
  #   (2) the same canonical schema with every migrations/*.sql replayed on top.
  # WHY: provision.ts / the compose `provision` service REPLAY every migration on every `up` (that is
  # how an ageing volume is kept converged — see the `provision-heals-stale-db` job), so a broken or
  # non-idempotent migration now breaks the DEPLOY ITSELF, and schema↔migration drift would surface only
  # in production. This job is what keeps that replay safe: it is the HARD proof, on every commit, that
  # the whole set applies cleanly, is idempotent, and converges to the canon.
  #  - HARD GATE: every migration applies cleanly on the canonical schema AND is idempotent (replayed
  #    twice — same proof as the seed×2 check above). A non-idempotent/broken migration fails the build.
  #  - HARD GATE: a normalized DDL diff between the two paths must be EMPTY (any structural divergence
  #    fails the build). Promoted from advisory → blocking once the ownership_transfers principal_type
  #    CHECK-name drift (migration 0023 vs database_schema.sql) was reconciled to a single canonical
  #    constraint pair (migration 0026, fix-wave 1.1) — both bootstrap paths are now byte-identical.
  #
  # KNOWN LIMITATION (AUDIT5 Р-9): both paths START from database_schema.sql (path 2 = canon + replay),
  # so a change that lives ONLY in canon appears on BOTH sides of the diff and cancels out — this diff
  # is one-sided by construction and is blind to a canon-only removal. The ideal fix (Р9-A: a frozen,
  # independent pre-audit baseline as a true second reconstruction path) is NOT achievable — the
  # pre-audit baseline does not converge under migration replay (ordering forward-refs + unconditional
  # PostGIS geography with no bridging migration; see AUDIT5/PACK-PROPOSAL.md §Р-9 / Q7). The accepted
  # Q7-FALLBACK is the `schema-invariants` job below (registry existence-assert + Q8 meta-gate), an
  # INDEPENDENT compensating gate that catches canon-only removals of NAMED invariants. Р9-A remains
  # OWED (a dedicated ADR) — the residue it alone would catch (a canon-only ADD of an UNNAMED object)
  # is the recorded debt, not dissolved into "done".
  migration-drift:
    runs-on: ubuntu-latest
    env:
      PGUSER: zoolink
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway databases (canonical vs migrated)
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE canonical;'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE migrated;'

      - name: Path 1 — fresh DB from canonical database_schema.sql
        run: psql -d canonical -v ON_ERROR_STOP=1 -f database_schema.sql

      - name: Path 2 — canonical schema + replay migrations (pass 1, must apply cleanly)
        run: |
          psql -d migrated -v ON_ERROR_STOP=1 -f database_schema.sql
          for f in migrations/*.sql; do
            echo "::group::apply $f (pass 1)"; psql -d migrated -v ON_ERROR_STOP=1 -f "$f"; echo "::endgroup::"
          done

      - name: Idempotency — replay all migrations AGAIN (pass 2, HARD GATE, like seed×2)
        run: |
          for f in migrations/*.sql; do
            echo "::group::apply $f (pass 2)"; psql -d migrated -v ON_ERROR_STOP=1 -f "$f"; echo "::endgroup::"
          done

      - name: DDL drift diff — canonical vs migrated (BLOCKING — both bootstrap paths must be identical)
        run: |
          # Normalize: drop pg_dump session tokens (\restrict/\unrestrict), SQL comment lines (incl.
          # inside function bodies), SET / SELECT pg_catalog noise, and blanks. --no-comments drops
          # COMMENT ON statements at the source. What remains is pure DDL (tables/columns/constraints/
          # indexes/functions/triggers) — the structural surface drift would actually break.
          norm() { grep -vE '^(\\restrict|\\unrestrict)' | grep -vE '^[[:space:]]*--' \
                   | grep -vE '^(SET |SELECT pg_catalog|$)'; }
          pg_dump -d canonical --schema-only --no-owner --no-privileges --no-comments -n public | norm > canonical.ddl
          pg_dump -d migrated  --schema-only --no-owner --no-privileges --no-comments -n public | norm > migrated.ddl
          if diff -u canonical.ddl migrated.ddl; then
            echo "✅ no schema↔migrations DDL drift — both bootstrap paths are structurally identical"
          else
            echo "::error::schema↔migrations DDL drift detected (diff above) — reconcile database_schema.sql with migrations/ per ADR-0007 (fix the document first, then re-run)"
            exit 1
          fi

  # Schema-invariant gate (AUDIT5 commit-2 · Р9-B / Р10-B / Q8). The AUTHORITATIVE, independent
  # check that every NAMED critical invariant (chk_/uq_/trg_) the schema promises actually EXISTS in
  # the applied schema — and that the canon and the registry cannot drift apart. It closes the two
  # holes the other gates cannot:
  #   - Р-9: migration-drift's DDL diff is one-sided (both paths start from canon) → blind to a
  #     canon-only removal. Here the registry is a THIRD artifact, independent of both bootstrap
  #     paths: dropping a named invariant from canon (+ its migration) → the canon-built DB lacks it
  #     → the existence-assert REDs (it is not cancelled by any diff).
  #   - Р-10: DB-invariant e2e can silently measure a stale dev DB; this job builds a THROWAWAY DB
  #     from database_schema.sql (migration-drift's proven machinery) so it always measures the
  #     artifact, and asserts by NAME against pg_constraint/pg_class/pg_trigger/pg_proc.
  #   - Q8 META-GATE: every chk_/uq_/trg_ DEFINED in canon must be in scripts/schema-invariants.txt,
  #     so a hand-maintained registry cannot silently lose items.
  # HARD GATE. Self-tested (evidence in the commit): a canon constraint outside the registry REDs the
  # meta-gate; a dropped registered invariant REDs the existence-assert.
  schema-invariants:
    runs-on: ubuntu-latest
    env:
      PGUSER: zoolink
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: canonical
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build throwaway canonical DB from database_schema.sql
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE canonical;'
          psql -d canonical -v ON_ERROR_STOP=1 -f database_schema.sql
      - name: Schema-invariant gate (existence-assert Р9-B/Р10-B + meta-gate Q8)
        run: bash scripts/check-schema-invariants.sh

  # Migration BACKFILL-on-populated-data gate (AUDIT4 P2-3). The migration-drift job proves DDL
  # idempotency + schema convergence on EMPTY tables — where every backfill-then-`SET NOT NULL`
  # migration's data path is a no-op. This job SEEDS representative rows first, then replays the
  # backfill migrations (0033/0032/0036) twice and asserts the backfill produced the correct value +
  # the NOT NULL constraint holds — the data-correctness case the empty-table gate cannot reach.
  # HARD GATE: a wrong/missing backfill fails the build. Runs against a throwaway DB the script creates.
  migration-backfill:
    runs-on: ubuntu-latest
    env:
      PGUSER: zoolink
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
      PGADMIN_DB: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Backfill correctness on populated tables (fail-on-wrong-backfill)
        run: bash scripts/check-migration-backfill.sh

  # RF data-residency gate (ADR-0017; ФЗ-152 ст.18 ч.5) — layer 2 of the 3-layer guardrail
  # (layer 1 = boot refine in env.validation.ts; layer 3 = the documented region-pin in
  # deployment_specification.md). BLOCKING: fails the pipeline if any region-bearing value in the
  # prod deploy config (every `*_REGION` var — object store, and future managed-PG/replica/backup/
  # DR/log-sink region vars — plus any foreign cloud-region token) is outside the approved RF
  # allowlist. The allowlist is extracted from env.validation.ts, so layers 1 and 2 never diverge.
  residency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RF data-residency check (fail-on-non-RF-region)
        run: bash scripts/check-rf-residency.sh

  # Dropped-NAME reuse gate (Pack 5). Planned to become blocking (its name is not in branch protection
  # yet — until then this comment does not claim it blocks). Pure static analysis of database_schema.sql
  # + migrations/*.sql: no database, no npm install, ~1s — so it fails BEFORE anything expensive.
  # WHY IT EXISTS: provision.ts step 2 replays EVERY migration unconditionally on every `up` (that is what
  # heals a stale volume), so every `DROP COLUMN IF EXISTS` in the set is a LIVE statement forever. If the
  # canon or a LATER migration ever introduces a column whose name an EARLIER migration drops, each restart
  # drops the populated column and recreates it EMPTY: schema perfect, data gone.
  # WHY STATIC AND NOT VIA THE DB, measured 2026-08-08 on ephemeral PG 16 — the sibling migration-drift job
  # does NOT cover this, and worse, ITS OWN REMEDY ARMS THE MINE: drift reds on the first attempt (the
  # recreated column moves to the END of the table, so the dumps differ by column ORDER), its error text
  # says "reconcile database_schema.sql with migrations/", and the moment a developer does exactly that the
  # two dumps become BYTE-IDENTICAL and drift goes GREEN — while an ageing volume loses the data on the next
  # `up`. A dump-similarity measure cannot see this class; a NAME-level check can, in both scenarios.
  # NO FOSSIL: measured that xmin does not even move (Postgres does not rewrite the rows), so unlike the
  # 0007/0042 mine there is nothing to point at afterwards — which is why the gate is preventive.
  # Covers the same mine one level up too (DROP TABLE vs a later CREATE TABLE); zero DROP TABLEs exist
  # today, so that axis is noise-free by construction.
  # SELF-TESTED in the same job: mutants, each forced to RED/ABORT/GREEN for its own reason — including an
  # ANTI-false-RED one (the same column name on an UNRELATED table must stay GREEN; the tree has two live
  # instances of that shape, so a naive name check would red in five places and get switched off).
  dropped-name-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20        # no `cache: npm` on purpose — this gate installs nothing
      - name: A dropped (table, column) name must never be reused
        run: node scripts/check-dropped-column-reuse.js
      - name: MUTATION PROOF — the gate must RED when a burned name is reused, ABORT when it cannot measure
        run: DROPPED_NAME_SELFTEST=1 node scripts/check-dropped-column-reuse.js

  # Market de-coupling gate (ADR-0018 Part-2 / Wave D8). BLOCKING: fails if any listing/moderation
  # read-path re-derives a listing's market with a raw `animals ⋈ species` join instead of reading the
  # derived `listings.market` cache (D3) — the sole cross-aggregate access point is AnimalService.
  # Documented exceptions are tagged inline with `grep-allow-market-join` (non-market projection only).
  market-decoupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No raw market-join in listing/moderation (ADR-0018 D8)
        run: bash scripts/check-no-raw-market-join.sh

  # Edge client-IP contract gate (AUDIT5 §F1b, security co-sign У-2/У-6). BLOCKING: the rate-limiter
  # keys its buckets on `X-Real-IP`, which is only trustworthy because deploy/Caddyfile REWRITES it
  # (Caddy overwrites XFF by default but passes an inbound X-Real-IP through verbatim). Either half
  # alone is a silent fail-OPEN, so this makes them mutually obligatory and forbids re-introducing
  # forwarded-chain / hop-count trust. Lines that only DISCUSS it carry `edge-ip-grep-allow`.
  edge-client-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: App-trusts-X-Real-IP ⟺ edge-rewrites-X-Real-IP (AUDIT5 §F1b)
        run: bash scripts/check-edge-client-ip.sh

  # Seed↔canon PARITY gate (AUDIT5 §F1d / Ф-1, verdict Q5=A). BLOCKING.
  # The sibling `migration-drift` job diffs `pg_dump --schema-only --no-comments`, so seed INSERTs are
  # OUTSIDE its field of view entirely — Р-9 applied to DATA instead of DDL. That blindness let the
  # `saved_search_matched` notification template live ONLY in migration 0037 and never reach the canon:
  # a canon-built install (canon + seed; seed.ts replays only 0011/0010/0022) got 22 of 24 templates, so
  # the H4 saved-search notification loop was silently DEAD there while every replay-built dev DB looked
  # healthy. This job compares the actual REFERENCE DATA of the two bootstrap paths — Path-1 (canon +
  # seed, which build-test / migration-drift Path-1 / schema-invariants all build from, and which the
  # runbook documents) vs Path-2 (canon + all migrations + seed) — row by row. The canon must stand
  # alone even though provision.ts now also replays the migrations: it is the artefact every other
  # consumer reads, so a seed row living only in a migration is invisible to all of them.
  # Both lists it needs are DERIVED, never hand-maintained: the seed-file list is extracted from
  # seed.ts's SEED_FILES, the seeded-table list from the `INSERT INTO` statements in canon + migrations
  # (so a new reference table is covered the moment it is seeded — no registry to forget).
  # It ALSO compares values the two artefacts BOTH carry but carry DIFFERENTLY — a class no row diff can
  # see, because `ON CONFLICT DO NOTHING` + canon-runs-first means the migration's text never lands in
  # ANY database. The gate replays the migrations a second time with each conflict clause mechanically
  # rewritten to DO UPDATE (column list taken from the INSERT itself, so no per-table knowledge), which
  # inverts who wins and makes the disagreement observable. Divergences that are DELIBERATE are declared
  # in scripts/seed-parity-known-divergences.txt, which the gate READS as a TWO-SIDED contract: a
  # divergence missing from the registry is RED, and a registry entry no longer matching reality is ALSO
  # RED ("stale") — so the file cannot rot into a forgotten allow-list that silences a real drift.
  # SELF-TESTED in the same job: the second step runs FOUR mutants and requires each to go RED with its
  # own evidence, not merely a non-zero exit — M1 a canon copy missing one seed row (row check), M2 a new
  # undeclared value divergence (artefact check), M3 a stale registry entry, M4 an unusable registry
  # (exit 2 = INCONCLUSIVE, never a verdict). So "green gate" can never silently mean "gate cannot fail",
  # and the registry cannot be used to shut up a red build.
  # DECLARED BLIND SPOT (printed by the gate itself in EVERY outcome): a reference row living ONLY in the
  # canon cancels out on both sides and stays green — one-sidedness BY CONSTRUCTION (a migrations-only
  # path cannot converge: 0010 needs supported_languages rows that 0011 seeds), so it is named, not fixed
  # here. Same for inserts deduplicated with WHERE NOT EXISTS instead of ON CONFLICT (today: cities).
  seed-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGUSER: zoolink
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
      PGADMIN_DB: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed↔canon parity — Path-1 (canon+seed) vs Path-2 (canon+migrations+seed)
        run: bash scripts/check-seed-parity.sh
      - name: MUTATION PROOF — four mutants, each must RED with its own evidence (row loss / new divergence / stale registry / unusable registry)
        run: SEED_PARITY_SELFTEST=1 bash scripts/check-seed-parity.sh

  # Ageing-volume convergence gate. BLOCKING.
  # Found live 2026-08-07: `provision.ts` applied the canon ONLY to an empty DB and replayed NO
  # migrations, so a five-week-old compose volume froze at its original shape while the code moved on —
  # `POST /api/v1/auth/register/phone` returned 500 `users.email_bidx does not exist` (migration 0028)
  # while `/health/live`, `/health/ready` and `GET /listings` were all GREEN, because none of them touch
  # the new columns. Schema drift invisible to every health signal is exactly what no other job here can
  # see: every OTHER CI database is created FRESH, which is the one state that cannot reproduce it.
  # This job builds a NON-EMPTY LAGGING database and asserts three things — the current provisioner
  # HEALS it (column + index back, register-shaped INSERT succeeds, and a 2nd run is still green), the
  # PRE-FIX behaviour fails on EXACTLY SQLSTATE 42703/email_bidx (negative control, so a green positive
  # axis means something), and an empty migrations dir (a dropped `./migrations:/migrations:ro` bind
  # mount) ABORTS provisioning loudly instead of silently reverting to the broken behaviour.
  provision-heals-stale-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGUSER: zoolink
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
      PGADMIN_DB: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoolink
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoolink" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # fetch-depth: 0 is REQUIRED, not hygiene — the gate's NEGATIVE-1 axis runs the REAL pre-fix
      # provisioner via `git show <pinned-sha>:backend/src/provision.ts`, and the default shallow
      # (depth-1) checkout cannot reach that revision. The script fails loudly rather than skipping if
      # it is unreachable, so a regression here is a red build, not a silently dropped axis.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # provision.ts / seed.ts need only ts-node + pg (no Prisma client), so `npm ci` is sufficient.
      - name: Install (provisioner needs ts-node + pg)
        run: cd backend && npm ci
      - name: Provision converges a NON-EMPTY, LAGGING database (+ negative controls, + ×2)
        run: bash scripts/check-provision-heals-stale-db.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (for audit)
        run: cd backend && npm ci
      # Security-gate policy:
      #  - HARD GATE: no HIGH+ vulnerabilities in the PRODUCTION dependency tree (this is what the
      #    runtime image ships — built with `npm ci --omit=dev`). Fails the build.
      - name: Dependency audit — production tree (blocking)
        run: cd backend && npm audit --omit=dev --audit-level=high
      #  - ADVISORY: full tree (incl. dev tooling) for visibility; does not block (dev-only CVEs
      #    don't ship). Promote to blocking once the dev-tree backlog is burned down.
      - name: Dependency audit — full tree (advisory)
        run: cd backend && npm audit --audit-level=high
        continue-on-error: true
      # SAST / container scan are now BLOCKING gates, but tuned to HIGH-severity only so they gate on
      # exploitable findings without drowning the build in low-confidence noise on the existing codebase
      # (Wave F). Rationale for the threshold split:
      #  - Semgrep: p/owasp-top-ten mixes ERROR (high-confidence, exploitable) with WARNING/INFO
      #    (stylistic / low-confidence) rules. We BLOCK on ERROR-severity only (`--severity ERROR
      #    --error`) and keep a full-severity pass as ADVISORY visibility. Run via the pinned CLI (the
      #    deprecated returntocorp/semgrep-action gives no severity control through `with:`).
      #  - Trivy: already scoped to HIGH,CRITICAL; making it blocking needs `exit-code: 1` (the action
      #    exits 0 on findings by default). `ignore-unfixed: true` drops OS/transitive CVEs with no
      #    available fix — those are un-actionable and would wedge every build.
      # SARIF upload / a lower threshold are the next tightening step once this baseline is clean.
      - name: SAST (Semgrep, OWASP Top-10) — BLOCKING on ERROR-severity
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --config p/owasp-top-ten --severity ERROR --error --quiet
      - name: SAST (Semgrep, OWASP Top-10) — full-severity advisory (visibility)
        run: semgrep --config p/owasp-top-ten --quiet
        continue-on-error: true
      - name: Filesystem scan (Trivy) — BLOCKING on HIGH,CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      # DAST (OWASP ZAP baseline) runs against staging on a schedule, not per-PR.

  # --- Edge base-path smoke (AUDIT5 C1 / §F1a) — MANDATORY GATE ------------------------------------
  # The ONE place the public edge is exercised the way a BROWSER hits it: a non-health route THROUGH
  # Caddy on the documented base `/api/v1`. Every other test (the e2e suite via supertest) bypasses the
  # edge and is therefore blind to a base-path drift — that blindness is exactly what let `/api/v1`
  # (contract + Caddy) diverge from `/v1` (backend, no setGlobalPrefix) unnoticed until the frontend
  # audit. This job brings up the REAL compose topology (Caddy + api + deps) and asserts:
  #   (1) GET /api/v1/listings THROUGH Caddy is NOT 404  → the global `api` prefix reaches a real route
  #       (200/401/422 all pass; only 404 means the edge missed — the C1 failure mode).
  #   (2) GET /health/live THROUGH Caddy is 200 AND /api/health/live is 404 → health stayed version-
  #       neutral at the ROOT and did NOT move under /api (the API_PREFIX_EXCLUDE opt-out holds end-to-
  #       end — the container HEALTHCHECK and Caddy `handle /health/*` keep working).
  #   (3) NEGATIVE CONTROL: the env this job runs on is produced by the SAME canonical provisioner the
  #       runbook documents (`deploy/gen-env.sh`), and the *rejected* path (`cp .env.example .env`) is
  #       proven to fail the production boot. See the two env steps below.
  # Mutation proof: dropping setGlobalPrefix (or reverting Caddy `handle` to strip the prefix) turns
  # assertion (1) into 404. PUBLIC_DOMAIN=localhost → Caddy serves HTTPS with its internal CA, so
  # `curl -k https://localhost/...` reaches the edge without a public domain / Let's Encrypt.
  #
  # WHY the env is GENERATED, not written here (У-1/У-6): this job used to hand-write the whole `.env`
  # in a heredoc — including `METRICS_TOKEN=ci_...`. That hand-written line silently repaired a real
  # PROVISIONING HOLE: the documented path `cp .env.example .env` leaves METRICS_TOKEN empty, so a
  # NODE_ENV=production boot dies in env.validation.ts. CI was green while the runbook was broken.
  # Now CI runs the operator's own path, so the runbook is under test and no secret literal lives in
  # this file.
  edge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- NEGATIVE CONTROL (runs FIRST, in its own compose project, and removes its own .env) ------
      # Proves the hole is real and stays closed: the OLD documented path must fail the production
      # boot, and must fail for EXACTLY the METRICS_TOKEN reason. A failure for any other reason
      # (image broken, another missing key) is red — otherwise this step would "pass" on noise.
      # Isolation: `-p zoolink-negctl` (separate compose project + network) and `rm -f .env` before the
      # real run generates its own. Nothing here is a real secret — `.env.example` is committed
      # placeholder material — and the log is grep-filtered to validation lines, never dumped whole.
      - name: NEGATIVE CONTROL — `cp .env.example .env` must FAIL the prod boot on METRICS_TOKEN
        run: |
          cp .env.example .env
          docker compose -p zoolink-negctl build api
          set +e
          docker compose -p zoolink-negctl run --rm --no-deps api > negctl.log 2>&1
          rc=$?
          set -e
          rm -f .env
          echo "production boot on a raw .env.example copy exited: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "::error::The provisioning hole is NOT reproducible: a raw 'cp .env.example .env' booted successfully in production. Either .env.example now carries a METRICS_TOKEN (it must stay an empty FORM) or the env.validation.ts prod gate was removed."
            grep -E 'Invalid environment configuration|^  - [A-Z_]+:|Error' negctl.log | head -20 || true
            exit 1
          fi
          if ! grep -q 'METRICS_TOKEN: required in production' negctl.log; then
            echo "::error::The prod boot failed, but NOT on the expected METRICS_TOKEN env-validation error — this step only certifies that ONE failure mode, so any other cause is a red."
            grep -E 'Invalid environment configuration|^  - [A-Z_]+:|Error' negctl.log | head -20 || true
            exit 1
          fi
          echo "OK: the raw .env.example path is rejected at boot on METRICS_TOKEN, as documented."
      - name: NEGATIVE CONTROL — tear down its isolated project
        if: always()
        run: docker compose -p zoolink-negctl down -v --remove-orphans || true

      # --- The env the REAL run uses: the canonical provisioner, same command the runbook gives ------
      # Only NON-secret overrides are passed as arguments (У-6: no secret literal in this file). Every
      # secret is minted inside the script with `openssl rand -hex`; the script prints key NAMES only.
      - name: Compose env — generate .env with the canonical provisioner (deploy/gen-env.sh)
        run: |
          test ! -e .env  # the negative control must have removed its copy
          bash deploy/gen-env.sh --domain localhost --node-env production
          stat -c 'mode=%a %n' .env          # 0600 expected — no values printed
          bash deploy/gen-env.sh             # read-only check: must report the file complete, exit 0
      - name: Bring up the real edge topology (Caddy + api + deps)
        run: docker compose up -d --build
      - name: Wait for the API to become ready THROUGH Caddy (/health/ready)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/health/ready || true)
            echo "attempt $i: /health/ready -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::API did not become ready through Caddy in time"; exit 1
      - name: SMOKE 1 — GET /api/v1/listings through Caddy must NOT be 404 (edge reaches a real route)
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/listings)
          echo "GET /api/v1/listings -> $code"
          if [ "$code" = "404" ] || [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "::error::Edge missed: /api/v1/listings returned '$code' (expected non-404: 200/401/422). The global 'api' prefix is not reaching the backend — C1 regression."
            exit 1
          fi
      - name: SMOKE 2 — health stayed at ROOT (/health/live=200, /api/health/live=404)
        run: |
          root=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/health/live)
          prefixed=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/health/live)
          echo "GET /health/live -> $root ; GET /api/health/live -> $prefixed"
          if [ "$root" != "200" ]; then
            echo "::error::/health/live is not 200 at the root ($root) — the health opt-out from the api prefix is broken (HEALTHCHECK/Caddy passthrough would fail)."
            exit 1
          fi
          if [ "$prefixed" != "404" ]; then
            echo "::error::/api/health/live returned $prefixed (expected 404) — health was wrongly moved under the api prefix."
            exit 1
          fi
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
