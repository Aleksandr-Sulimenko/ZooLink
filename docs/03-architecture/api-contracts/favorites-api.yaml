openapi: 3.0.3
info:
  title: ZooLink Favorites API
  version: 1.0.0
  description: >
    User favorites (saved listings). Conforms to API_CONVENTIONS.md: bearer auth required,
    RFC7807 Problem errors, page/limit pagination. Backed by the `favorites` table (UNIQUE user_id+listing_id).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /favorites:
    get:
      summary: List the current user's favorite listings
      x-required-roles: [USER, BREEDER, FARMER, MODERATOR, ADMIN]
      parameters:
        - { in: query, name: page,  schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Page of favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Favorite" } }
                  meta:  { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /listings/{id}/favorite:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Add a listing to favorites (idempotent)
      x-required-roles: [USER, BREEDER, FARMER, MODERATOR, ADMIN]
      responses:
        "201": { description: Added (or already present) }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove a listing from favorites (idempotent)
      x-required-roles: [USER, BREEDER, FARMER, MODERATOR, ADMIN]
      responses:
        "204": { description: Removed (or was absent) }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Favorite:
      type: object
      # OfferingRef seam (ADR-0014 §Amendment 2026-07-04 rule 11 — form-now, migration 0032).
      # WHAT: the polymorphic pair offeringType/offeringId ships from day one (default ANIMAL_LISTING);
      #   the pre-existing listingId is RETAINED as a deprecated read-only alias == offeringId whenever
      #   offeringType == ANIMAL_LISTING.
      # WHY: a v1 body committed against a listing-only listingId cannot be retrofitted truthfully once a
      #   species-less offering (service/goods) exists — it would become a breaking v1 change. This must
      #   precede the favorites controller (D11).
      # WHY-BETTER: additive & non-breaking — existing clients keep reading listingId; new clients read the
      #   polymorphic pair. When a subtype ships, offeringType widens additively and listingId is simply
      #   absent for non-listing offerings (still no break: it was always documented as the ANIMAL_LISTING alias).
      properties:
        id:           { type: string, format: uuid }
        offeringType:
          type: string
          enum: [ANIMAL_LISTING]
          default: ANIMAL_LISTING
          description: Offering category (ADR-0014). Only ANIMAL_LISTING today; widened additively per subtype.
        offeringId:
          type: string
          format: uuid
          description: Polymorphic pointer to the favorited offering. For ANIMAL_LISTING it equals listingId.
        listingId:
          type: string
          format: uuid
          deprecated: true
          description: >-
            DEPRECATED alias of offeringId, present only when offeringType == ANIMAL_LISTING (retained for
            backward compatibility). Prefer offeringType/offeringId.
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
  responses:
    Problem:
      description: RFC7807 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
