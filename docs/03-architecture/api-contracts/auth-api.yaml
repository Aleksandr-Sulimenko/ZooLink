openapi: 3.0.3
info:
  title: ZooLink Auth API
  version: 1.0.0
  description: >-
    API for user authentication, authorization, and profile management in ZooLink.
    Conforms to API_CONVENTIONS.md: camelCase bodies (§0), bearer auth with public opt-out (§2),
    x-required-roles (§3), RFC7807 Problem errors (§4), 7-role enum (§3), rate limiting (§8),
    If-Match/ETag on mutating PATCH (§10).
servers:
  - url: /api/v1
    description: ZooLink API v1
security:
  - bearerAuth: []
paths:
  /auth/register/phone:
    post:
      summary: Register user via phone/SMS — sends an OTP (passwordless, OTP-first)
      operationId: registerPhone
      security: []
      description: >-
        Public (security opt-out). (round-4/Phase-2, normative) Creates the account in
        PENDING_VERIFICATION and sends a 6-digit SMS OTP. No tokens are issued here — the session is
        minted by /auth/verify-phone after the code is confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPhoneRequest' }
      responses:
        '202':
          description: OTP sent; phone verification required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterPhoneResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/register/oauth/{provider}:
    post:
      summary: Register/Login user via OAuth provider
      operationId: registerOAuth
      security: []
      description: Public (security opt-out).
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, apple, telegram, vk] }
          description: OAuth provider name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthRequest' }
      responses:
        '200':
          description: User logged in successfully (existing user); a refresh_token cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth); refresh token is NEVER in the body (AUDIT3 #2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '201':
          description: User registered successfully (new user); a refresh_token cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth); refresh token is NEVER in the body (AUDIT3 #2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/verify-phone:
    post:
      summary: Verify phone with SMS code — activates the account and issues a session
      operationId: verifyPhone
      security: []
      description: >-
        Public (security opt-out). (round-4/Phase-2, normative) Validates the OTP, transitions the user
        to ACTIVE and returns the session — access token + profile in the body, refresh token as the
        HttpOnly refresh_token cookie (AUDIT3 #2). 5 failed attempts →
        15-min lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPhoneRequest' }
      responses:
        '200':
          description: Phone verified; session issued (a refresh_token cookie is set)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth); refresh token is NEVER in the body (AUDIT3 #2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/recover/email/request:
    post:
      summary: Request account recovery via a verified email (sends an OTP)
      operationId: recoverEmailRequest
      security: []
      description: >-
        Public (security opt-out). (Slice-4, normative) Account recovery for a user who lost access to
        the phone/OAuth they registered with but has a VERIFIED email on file. Sends a 6-digit OTP to
        that email. For privacy this ALWAYS returns 202 even if no account/verified-email matches (no
        account enumeration). The OTP only activates a recovery session when /auth/recover/email/verify
        is called with a real code. If the account is DEACTIVATED within the 30-day grace, a successful
        recovery also reactivates it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverEmailRequest' }
      responses:
        '202':
          description: If a recoverable account with that verified email exists, an OTP was sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoverEmailRequestResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/recover/email/verify:
    post:
      summary: Verify the email recovery OTP — issues a session
      operationId: recoverEmailVerify
      security: []
      description: >-
        Public (security opt-out). (Slice-4, normative) Validates the recovery OTP sent to the verified
        email and returns a fresh session — access token + profile in the body, refresh token as the
        HttpOnly refresh_token cookie (AUDIT3 #2). 5 failed attempts →
        15-min lockout. SUSPENDED accounts cannot be recovered (operator action required). A DEACTIVATED
        account within grace is reactivated; past grace it cannot be recovered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverEmailVerifyRequest' }
      responses:
        '200':
          description: Recovery verified; session issued (a refresh_token cookie is set)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth); refresh token is NEVER in the body (AUDIT3 #2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/role:
    patch:
      summary: '[ADMIN] Grant/change a user role (role-elevation)'
      operationId: adminSetUserRole
      description: >-
        (Slice-4, normative) USER → BREEDER/FARMER/VETERINARIAN/GROOMER (and operator roles) is
        ADMIN-granted, never self-claimed. Audit-logged; a role change revokes ALL refresh-token
        families for the target user (round-4 "role change → revoke all families").
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleRequest' }
      responses:
        '200':
          description: Role updated; target sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/rebind:
    post:
      summary: '[ADMIN] Re-bind a user phone/OAuth identifier (assisted recovery)'
      operationId: adminRebindIdentifier
      description: >-
        (Slice-4, normative) ADMIN-assisted, audit-logged re-binding of the phone or an OAuth
        identifier for a user who lost access and has no verified email. No silent takeover — the
        action is attributed to the ADMIN in audit_log. Re-binding revokes ALL of the target's
        sessions. Exactly one identifier (newPhone OR oauth provider+id, or a clear) per call.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebindRequest' }
      responses:
        '200':
          description: Identifier re-bound; target sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/erase:
    post:
      summary: '[ADMIN] Erase (anonymise-in-place) a user — ФЗ-152 right-to-erasure'
      operationId: adminEraseUser
      description: >-
        (Slice-4, normative) Runs the `erase_user` procedure (data-governance.md §2): anonymise
        users PII (UUID retained so FK RESTRICT rows stay valid), release identifiers (phone_hash /
        oauth_* / email NULLed), revoke all sessions, redact notification_logs recipient/content,
        NULL avatar_url. Append-only audit_log/moderation_decisions are RETAINED under legal hold.
        Idempotent — erasing an already-erased account is a no-op 200. Status becomes DEACTIVATED
        with an `erased_at` marker.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200': { description: User erased (or already erased — idempotent) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/agents/{agentUserId}/credentials:
    post:
      summary: '[ADMIN] Issue an agent service-credential (plaintext secret returned once)'
      operationId: issueAgentCredential
      description: >-
        (ADR-0036 §2, normative) A human ADMIN issues a service-credential for an AGENT account
        (a users row with principal_type='AGENT'). The plaintext secret `zlk_agent_<credId>_<secret>`
        is returned EXACTLY ONCE (never retrievable again — only the HMAC `secret_hash` persists).
        Issuance is a HUMAN-only capability (never in any AGENT scope — ADR-0037) and is audited as a
        HUMAN act (secret never logged). Credentials may be pre-provisioned while the
        `agent_service_auth` master gate is off; they authenticate nothing until it is flipped on.
        422 if the target is not an AGENT account or the capability profile does not exist.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AgentUserIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCredentialRequest' }
      responses:
        '201':
          description: Credential issued; plaintext secret returned ONCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialIssuedResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/agents/{agentUserId}/credentials/{credId}/rotate:
    post:
      summary: '[ADMIN] Rotate an agent credential (issue-new; old NOT auto-revoked — overlap)'
      operationId: rotateAgentCredential
      description: >-
        (ADR-0036 §4, normative) Issue a NEW credential linked to the old via `rotatedFrom`, returning
        the new plaintext secret ONCE. The old credential is NOT auto-revoked — the overlap window lets
        the agent swap credentials with no downtime; revoke the old one separately once swapped.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AgentUserIdParam'
        - $ref: '#/components/parameters/CredIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialRequest' }
      responses:
        '201':
          description: New credential issued (rotatedFrom set); plaintext secret returned ONCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialIssuedResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /admin/agents/{agentUserId}/credentials/{credId}:
    delete:
      summary: '[ADMIN] Revoke an agent credential immediately (idempotent)'
      operationId: revokeAgentCredential
      description: >-
        (ADR-0036 §4, normative) Immediately revoke a credential (`is_active=false, revoked_at=now`).
        The next exchange rejects it; already-issued short-lived JWTs survive until their TTL. Idempotent
        — revoking an already-revoked credential is a no-op 204.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AgentUserIdParam'
        - $ref: '#/components/parameters/CredIdParam'
      responses:
        '204': { description: Credential revoked (or already revoked — idempotent) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/agent/token:
    post:
      summary: Exchange an agent service-credential for a short-lived AGENT access token
      operationId: exchangeAgentToken
      security: []
      description: >-
        (ADR-0036 §1, normative) A machine presents its long-lived `zlk_agent_<credId>_<secret>` secret
        ONCE and receives a short-lived AGENT access JWT (carrying the resolved least-privilege scope,
        ADR-0037). No refresh token is issued to an agent — it re-exchanges its secret. Gated by the
        `agent_service_auth` master toggle (off in MVP → 403). Rate-limited per credId + IP (429 +
        Retry-After). ANY verify failure (unknown/inactive/revoked/expired credential, non-agent account,
        or secret mismatch) returns ONE uniform 401 `INVALID_AGENT_CREDENTIAL` — no existence/timing oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTokenExchangeRequest' }
      responses:
        '200':
          description: A short-lived AGENT access token (Bearer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAccessTokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429':
          description: Rate limit reached (per credId + IP)
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the limiter window resets
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /me/erase:
    post:
      summary: Request erasure of the current account (ФЗ-152)
      operationId: eraseMe
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      description: >-
        (Slice-4, normative) Self-service right-to-erasure. Per data-governance.md §2 the canonical
        path is deactivate → 30-day grace → erase. This endpoint deactivates immediately if the
        account is still ACTIVE, then schedules/executes erasure. In the MVP (no scheduler for the
        grace job) it deactivates and records the erasure request; the actual anonymisation is run
        by the retention job / an ADMIN after grace. See Open Questions.
      responses:
        '202':
          description: Erasure requested; account deactivated, anonymisation scheduled after grace
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      summary: Rotate the refresh cookie and obtain a new access token
      operationId: refreshToken
      security: []
      description: >-
        Public (bearer opt-out). (normative) The refresh token is transported ONLY as the HttpOnly
        `refresh_token` cookie (API_CONVENTIONS §2 — never in the body, XSS-exfil defence). Rotation:
        the presented cookie is revoked and a fresh `refresh_token` cookie is set (Set-Cookie);
        replaying a rotated cookie burns the whole family (theft detection). No refresh token appears
        in the request or response body — the body carries only the new short-lived access token.
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema: { type: string }
          description: The HttpOnly refresh cookie from a prior session (dev-token / verify-phone / oauth / recover)
      responses:
        '200':
          description: Token refreshed; a new refresh_token cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: New HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      summary: Logout user (revoke session server-side + clear the refresh cookie)
      operationId: logout
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      description: >-
        (normative) Revokes the session server-side and clears the refresh cookie. When the
        `refresh_token` cookie is present, only that device's family is revoked (targeted logout);
        when it is absent, ALL of the caller's sessions are revoked (logout-everywhere). No request
        body — the refresh token is read from the cookie, never the body.
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema: { type: string }
          description: The refresh cookie for the device to log out (omit to revoke all sessions)
      responses:
        '204':
          description: Logged out; refresh_token cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cleared refresh_token cookie (Max-Age=0)
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      summary: Get current user profile
      operationId: getMe
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      responses:
        '200':
          description: Current user profile (returns a weak ETag for optimistic concurrency)
          headers:
            ETag:
              schema: { type: string }
              description: Weak validator to send back as If-Match on PATCH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '304':
          description: Not Modified (If-None-Match matched)
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update current user profile
      operationId: updateMe
      description: >-
        Optimistic concurrency (API_CONVENTIONS §10): requires the If-Match header carrying the
        ETag from a prior GET /me.
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: ETag from GET /me
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Profile updated successfully
          headers:
            ETag:
              schema: { type: string }
              description: New weak validator after update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      summary: Deactivate current user account
      operationId: deactivateMe
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      responses:
        '200': { description: Account deactivated successfully }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /me/reactivate:
    post:
      summary: Reactivate deactivated user account
      operationId: reactivateMe
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      responses:
        '200': { description: Account reactivated successfully }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/whoami:
    get:
      summary: '[internal] Return the authenticated principal (auth self-check)'
      operationId: whoami
      description: >-
        Internal/diagnostic endpoint, not part of the public product surface. Echoes the
        authenticated principal so the JwtAuthGuard can be exercised end-to-end (smoke/health of
        the auth chain). No data is mutated.
      x-internal: true
      x-required-roles: [USER, BREEDER, FARMER, VETERINARIAN, GROOMER, MODERATOR, ADMIN]
      responses:
        '200':
          description: The authenticated principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPrincipal' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/operator-check:
    get:
      summary: '[internal] Verify operator AuthZ end-to-end (role + policy)'
      operationId: operatorCheck
      description: >-
        Internal/diagnostic endpoint, not part of the public product surface. Requires the
        MODERATOR role plus a `read ModerationQueue` policy, so it exercises both the RolesGuard
        and the CASL PoliciesGuard in one call. No data is mutated.
      x-internal: true
      x-required-roles: [MODERATOR, ADMIN]
      responses:
        '200':
          description: Operator authorization succeeded
          content:
            application/json:
              schema:
                type: object
                required: [ok, role]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  role:
                    type: string
                    description: The caller's role (operator role on success)
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/dev-token:
    post:
      summary: '[dev only] Mint a session for an existing user id'
      operationId: devToken
      security: []
      description: >-
        DEV-ONLY session minting. Bridges auth end-to-end testing against a seeded user until the
        full login surface (phone OTP + OAuth) is live. **Fail-closed**: reachable ONLY when the
        explicit `ENABLE_DEV_TOKEN` flag is true AND `NODE_ENV!=='production'`; otherwise (including
        any production deploy, or any deploy that forgets to opt in) the endpoint responds
        `404 Not Found` (RFC7807). Not for any client/UI; do not depend on it.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevTokenRequest' }
      responses:
        '201':
          description: Session minted (dev/test only); refresh_token cookie set, access token in body
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly+Secure+SameSite=Strict refresh_token cookie (Path=/v1/auth)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: >-
            Not found — returned for the endpoint itself whenever it is not explicitly enabled
            (ENABLE_DEV_TOKEN not true) or in production (fail-closed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      # Refresh-token transport (API_CONVENTIONS §2): HttpOnly+Secure+SameSite=Strict cookie,
      # scoped to /v1/auth. Used by /auth/refresh and /auth/logout — never carried in a body.
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    UserIdParam:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
      description: Target user id (users.id)
    AgentUserIdParam:
      in: path
      name: agentUserId
      required: true
      schema:
        type: string
        format: uuid
      description: Target AGENT account id (users.id, principal_type='AGENT')
    CredIdParam:
      in: path
      name: credId
      required: true
      schema:
        type: string
        format: uuid
      description: Service-credential id (service_credentials.id)
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: >-
        API_CONVENTIONS §5 — optional idempotency key for the unsafe POST (24h replay window).
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        errors: { type: array, items: { type: object } }
    AuthPrincipal:
      type: object
      description: The authenticated actor attached to a request after JwtAuthGuard succeeds.
      required:
        - userId
        - role
        - principalType
      properties:
        userId:
          type: string
          format: uuid
          description: users.id of the authenticated actor
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN, BREEDER, FARMER, VETERINARIAN, GROOMER]
          description: Canonical role (must match the DB CHECK on users.role)
        principalType:
          type: string
          enum: [HUMAN, AGENT]
          description: A principal may be a human or an AI agent (ADR-0006)
    RecoverEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: The VERIFIED email on file for the account to recover
    RecoverEmailRequestResponse:
      type: object
      required:
        - status
        - expiresInSeconds
      properties:
        status:
          type: string
          enum: [VERIFICATION_REQUIRED]
          description: Always VERIFICATION_REQUIRED — confirm via /auth/recover/email/verify
        expiresInSeconds:
          type: integer
          description: OTP validity window in seconds (e.g. 300)
    RecoverEmailVerifyRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: The verified email the recovery OTP was sent to
        code:
          type: string
          pattern: '^\\d{6}$'
          description: 6-digit recovery code from email
    SetRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN, BREEDER, FARMER, VETERINARIAN, GROOMER]
          description: New role to grant (canonical 7-role set)
    RebindRequest:
      type: object
      description: >-
        Exactly one of `newPhone`, (`oauthProvider` + `oauthId`), or a clear
        (`oauthProvider` + `clear: true`) must be provided.
      properties:
        newPhone:
          type: string
          pattern: '^\\+?[1-9]\\d{1,14}$'
          description: New phone number (E.164) to bind (re-hashed server-side)
        oauthProvider:
          type: string
          enum: [google, apple, telegram, vk]
          description: OAuth provider whose identifier to (re)bind or clear
        oauthId:
          type: string
          description: New provider-side id to bind (omit with clear=true to unbind)
        clear:
          type: boolean
          description: When true with oauthProvider, unbinds that OAuth identifier
        reason:
          type: string
          maxLength: 500
          description: Operator-supplied reason (recorded in audit_log)
    RegisterPhoneRequest:
      type: object
      # (Phase-2/round-7, normative) Aligned with spec 01 round-4: end-user auth is PASSWORDLESS
      # (phone OTP) — `password` removed (password_hash is operator-only). `cityId` is an INTEGER
      # lookup (id-type convention: lookups=INT) and optional (set later via PATCH /me).
      required:
        - phone
        - fullName
      properties:
        phone:
          type: string
          pattern: '^\\+?[1-9]\\d{1,14}$'
          description: Phone number in E.164 format
        fullName:
          type: string
          maxLength: 100
          minLength: 2
          description: User's full name for display
        cityId:
          type: integer
          description: Reference to city (cities.id) for geo-search (optional)
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address for notifications (optional)
        avatarUrl:
          type: string
          format: uri
          description: https URL only; javascript:/data:/http rejected at validation (stored-XSS defence, AUDIT3 #2)
          maxLength: 500
          description: URL to avatar image in object storage (optional)
        preferredLanguage:
          type: string
          enum: [ru, en]
          description: Preferred language (supported_languages.code); defaults to ru
    OAuthRequest:
      type: object
      required:
        - code
        - fullName
      properties:
        code:
          type: string
          description: Authorization code from OAuth provider
        fullName:
          type: string
          maxLength: 100
          minLength: 2
          description: User's full name (can be overridden by provider data)
        cityId:
          type: integer
          description: Reference to city (cities.id) for geo-search (optional)
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address from provider (optional)
        avatarUrl:
          type: string
          format: uri
          description: https URL only; javascript:/data:/http rejected at validation (stored-XSS defence, AUDIT3 #2)
          maxLength: 500
          description: URL to avatar image from provider (optional)
    VerifyPhoneRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: '^\\+?[1-9]\\d{1,14}$'
          description: Phone number in E.164 format
        code:
          type: string
          pattern: '^\\d{6}$'
          description: 6-digit SMS verification code
    RegisterPhoneResponse:
      type: object
      required:
        - status
        - expiresInSeconds
      properties:
        status:
          type: string
          enum: [VERIFICATION_REQUIRED]
          description: Always VERIFICATION_REQUIRED — confirm via /auth/verify-phone
        expiresInSeconds:
          type: integer
          description: OTP validity window in seconds (e.g. 300)
    DevTokenRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
          description: Existing user id to mint a session for (dev/test only)
    AccessTokenResponse:
      type: object
      # (normative) Session response body = access token ONLY. The refresh token is delivered as the
      # HttpOnly refresh_token cookie (Set-Cookie), never in the body (API_CONVENTIONS §2 / XSS-exfil
      # defence). Returned by /auth/refresh and /auth/dev-token.
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 15 min; refresh TTL 7 d — spec 01 round-4)
    IssueCredentialRequest:
      type: object
      description: ADR-0036 §2 — all fields optional; a bare issuance mints a deny-by-default credential.
      properties:
        label:
          type: string
          maxLength: 120
          description: Human-readable purpose label (operability only; not authority)
        capabilityProfileId:
          type: integer
          description: ADR-0037 named scope profile (agent_capability_profiles.id). Omit ⇒ deny-by-default.
        expiresAt:
          type: string
          format: date-time
          description: Optional auto-expiry (ISO-8601). Omit ⇒ no expiry.
    RotateCredentialRequest:
      type: object
      description: ADR-0036 §4 — overrides for the rotated credential; omitted fields inherit the old credential's.
      properties:
        label: { type: string, maxLength: 120 }
        capabilityProfileId: { type: integer }
        expiresAt: { type: string, format: date-time }
    CredentialIssuedResponse:
      type: object
      required: [id, agentUserId, secret, capabilityProfileId, expiresAt, rotatedFrom, createdAt]
      properties:
        id: { type: string, format: uuid, description: The credential id (credId) }
        agentUserId: { type: string, format: uuid }
        secret:
          type: string
          description: >-
            The full `zlk_agent_<credId>_<secret>` token — shown ONCE, never retrievable again.
        capabilityProfileId: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        rotatedFrom: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AgentTokenExchangeRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          description: The `zlk_agent_<credId>_<secret>` service-credential secret
    AgentAccessTokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken:
          type: string
          description: Short-lived AGENT JWT (carries the resolved least-privilege scope, ADR-0037). No refresh token is issued.
        tokenType:
          type: string
          enum: [Bearer]
    AuthResponse:
      type: object
      # (normative) Session response body = access token + profile ONLY. The long-lived refresh token is
      # delivered as the HttpOnly+Secure+SameSite=Strict `refresh_token` cookie (Set-Cookie), NEVER in the
      # body (API_CONVENTIONS §2 / AUDIT3 security.md #2 — XSS-exfil defence). Returned by
      # /auth/verify-phone, /auth/register/oauth/{provider}, /auth/recover/email/verify.
      required:
        - accessToken
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 15 min; refresh token is the HttpOnly cookie — spec 01 round-4)
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required:
        - id
        - fullName
        - role
        - isActive
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        # (Phase-2/round-7, normative) phone_hash is a credential-derived secret and is NEVER
        # returned in profile responses — removed from this schema.
        oauthGoogleId:
          type: string
          nullable: true
          description: Unique ID from Google (null if not linked)
        oauthAppleId:
          type: string
          nullable: true
          description: Unique ID from Apple (null if not linked)
        oauthTelegramId:
          type: string
          nullable: true
          description: Unique ID from Telegram (null if not linked)
        oauthVkId:
          type: string
          nullable: true
          description: Unique ID from VK (null if not linked)
        fullName:
          type: string
          maxLength: 100
          description: Display name
        cityId:
          type: integer
          nullable: true
          description: Reference to city (cities.id) for geo-search
        avatarUrl:
          type: string
          format: uri
          description: https URL only; javascript:/data:/http rejected at validation (stored-XSS defence, AUDIT3 #2); null clears it
          nullable: true
          maxLength: 500
          description: URL to avatar in object storage
        email:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: Email address for notifications
        emailVerified:
          type: boolean
          default: false
          description: True if email confirmed via link
        role:
          type: string
          enum: [USER, MODERATOR, ADMIN, BREEDER, FARMER, VETERINARIAN, GROOMER]
          description: User role defining permissions (canonical 7-role set, spec 01 round-4)
        status:
          type: string
          enum: [UNVERIFIED, PENDING_VERIFICATION, VERIFIED, ACTIVE, SUSPENDED, DEACTIVATED]
          description: Lifecycle state (single source of truth; isActive is derived)
        preferredLanguage:
          type: string
          enum: [ru, en]
          description: Preferred language (supported_languages.code)
        isActive:
          type: boolean
          description: Derived from status (true unless SUSPENDED/DEACTIVATED)
        createdAt:
          type: string
          format: date-time
          description: Registration timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last profile update
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Last login timestamp
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          description: When user chose to deactivate (null if active)
    UpdateProfileRequest:
      type: object
      # (Phase-2/round-7, normative) passwordless — `password` removed; cityId is INTEGER (lookup).
      # All fields optional (partial update); at least one should be present.
      #
      # (ADR-0020, normative — WHAT/WHY/WHY-BETTER) contact-exchange channels added:
      #   WHAT — contactPhone / contactTelegram (the channels) + showPhone / showTelegram (per-channel
      #     visibility). Turning ANY channel on is the affirmative opt-in that records a CONTACT_DISTRIBUTION
      #     consent (append-only `consents` log) in the SAME transaction as the profile write; turning all
      #     channels off records a withdrawal (granted=false). contactPhone is AES-256-GCM at rest (ADR-0019).
      #   WHY — contact-reveal is LIVE but there was no writer for the seller's contact channels (the "dead
      #     marketplace", AUDIT2 BLOCKER); and ст.10.1 ФЗ-152 requires a separate, default-OFF, provable
      #     consent before распространение — this endpoint is that opt-in point.
      #   WHY-BETTER — one writer, one transaction: the channel data, the visibility, and the lawful-basis
      #     proof are set together and never drift; the default is all-OFF (ст.10.1), so nothing is
      #     distributed until the seller affirmatively opts in.
      properties:
        fullName:
          type: string
          maxLength: 100
          minLength: 2
          description: User's full name for display
        cityId:
          type: integer
          nullable: true
          description: Reference to city (cities.id) for geo-search (null clears it)
        avatarUrl:
          type: string
          format: uri
          description: https URL only; javascript:/data:/http rejected at validation (stored-XSS defence, AUDIT3 #2)
          maxLength: 500
          nullable: true
          description: URL to avatar image in object storage
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          description: Email address for notifications
        preferredLanguage:
          type: string
          enum: [ru, en]
          description: Preferred language (supported_languages.code)
        contactPhone:
          type: string
          nullable: true
          description: >-
            Marketplace contact phone (E.164). Stored AES-256-GCM at rest (ADR-0019); returned to buyers only
            on contact-reveal when showPhone is on AND distribution consent is granted. null clears it.
          example: '+79991234567'
        contactTelegram:
          type: string
          maxLength: 64
          nullable: true
          description: Marketplace contact Telegram handle (5–32 chars, optional leading @). null clears it.
        showPhone:
          type: boolean
          description: >-
            Show the phone to buyers on contact-reveal. Turning any channel on records CONTACT_DISTRIBUTION
            consent (ADR-0020, ст.10.1); turning all channels off withdraws it. Default all-OFF.
        showTelegram:
          type: boolean
          description: Show the Telegram handle to buyers on contact-reveal (same consent semantics as showPhone).
  responses:
    Problem:
      description: RFC7807 problem (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
